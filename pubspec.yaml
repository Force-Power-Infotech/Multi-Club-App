name: multi_club_app
description: "Club App with multiple club attributes"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 8.0.0+8

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  hive: 2.2.3
  hive_flutter: 1.1.0
  path_provider: ^2.0.5  # Use the latest version available
  autocomplete_textfield: ^2.0.1
  url_launcher: ^6.2.6
  rename: ^3.0.2
  permission_handler: ^11.3.1
  flutter_map: ^6.1.0
  # latlong2: ^0.9.1
  photo_view: ^0.15.0
  image_picker: ^1.1.1
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  http: ^1.2.1
  webview_flutter: ^4.10.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  change_app_package_name: ^1.2.0


  flutter_lints: ^4.0.0
icons_launcher:
  image_path: "assets/images/madhuwan_app_logo.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/madhuwan_app_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true

flutter:
  
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/

